<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하멜코리아 · 화물추적 포털</title>
<style>
:root{--navy:#0b2e4f;--navy2:#123f68;--blue:#1a6fb5;--sky:#e8f1fa;--org:#f2911e;--org2:#ffb14d;
  --bg:#eef2f7;--panel:#fff;--panel2:#f5f8fc;--line:#dce4ee;--txt:#17202b;--mut:#5b6b80;--mut2:#8b98a9;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:14px}
.hd{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hd .logo{width:36px;height:36px;border-radius:8px;background:#fff;padding:3px}
.hd .brand{font-weight:800;font-size:19px;letter-spacing:.3px;line-height:1.05}
.hd .brand small{display:block;font-weight:600;font-size:11px;color:var(--org2);letter-spacing:1.5px}
.hd .tit{font-weight:700;font-size:15px;opacity:.95}
.hd .sp{flex:1}
.moqv{background:#fff;color:#111;border:1.5px solid var(--org);border-radius:8px;padding:5px 11px;font-weight:800;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.moqv span{color:var(--org)}
.moqv:hover{background:#fff7ee}
.top{max-width:1240px;margin:0 auto;padding:16px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(16,32,60,.05);margin-bottom:14px}
.searchbar input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;font-size:15px}
.searchbar .cnt{color:var(--mut);font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:7px 15px;font-weight:700;color:var(--mut);cursor:pointer;font-size:13px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{margin-bottom:22px}
.sec h2{font-size:15px;color:var(--navy);margin:0 0 10px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--sky);padding-bottom:7px}
.sec h2 .badge{background:var(--sky);color:var(--navy);font-size:12px;border-radius:12px;padding:1px 9px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.cc{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bc,var(--blue));border-radius:11px;padding:11px 12px;text-decoration:none;color:var(--txt);transition:.12s}
.cc:hover{box-shadow:0 4px 14px rgba(16,32,60,.13);transform:translateY(-1px);border-color:var(--bc,var(--blue))}
.ic{width:46px;height:46px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border:1px solid var(--line);padding:4px}
.ic img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.fb{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:17px;border-radius:8px}
.chip{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;letter-spacing:.3px;border-radius:7px;text-align:center;line-height:1;padding:2px}
.info{min-width:0;flex:1}
.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sub{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.go{color:var(--mut2);font-size:15px;flex-shrink:0}
.cc:hover .go{color:var(--org)}
.empty{color:var(--mut);text-align:center;padding:26px}
.foot{color:var(--mut2);font-size:11px;text-align:center;padding:18px}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="hd">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 48 48"><path d="M8 30h32l-4 8H12z" fill="#0b2e4f"/><path d="M24 8l10 18H14z" fill="#1a6fb5"/><rect x="22" y="6" width="4" height="14" fill="#f2911e"/></svg></div>
  <div class="brand">HAMEL KOREA<small>PROJECT FREIGHT · CARGO TRACKING</small></div>
  <div class="tit">🚢 화물추적 포털</div>
  <div class="sp"></div>
  <a class="moqv" href="https://moqv.kr" target="_blank" rel="noopener">MO<span>Q</span>V.KR ↗</a>
</div>
<div class="top">
  <div class="searchbar">
    <input id="q" placeholder="🔎 선사·항공사 이름 / 코드 / 국가 검색 (예: HMM, MSC, 고려, ONE)" oninput="render()">
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

 {n:'China Southern Cargo',s:'CZ · 중국',h:'csair.com',c:'#00529b',cat:'air'},
 {n:'China Cargo Airlines',s:'MU · 중국',h:'chinacargo-airlines.com',c:'#c8102e',cat:'air'},

 {n:'EMS 우체국국제특송',s:'대한민국 · 특송',h:'ems.epost.go.kr',ld:'epost.go.kr',c:'#e4002b',cat:'exp'},
];
let TAB='all';
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function initial(n){const m=n.replace(/[^A-Za-z가-힣]/g,'');return (m[0]||'?').toUpperCase();}
function fbk(img){ if(img.dataset.s!=='1'){img.dataset.s='1';img.src='https://icons.duckduckgo.com/ip3/'+img.dataset.d+'.ico';}
  else{const sp=document.createElement('span');sp.className='fb';sp.style.background=img.dataset.c;sp.textContent=img.dataset.i;if(img.parentNode)img.parentNode.replaceChild(sp,img);} }
function chipFont(t){const n=(t||'').length;return n>=8?'8.5px':n>=6?'10px':n>=4?'12px':'15px';}
function card(x){const url='https://'+x.h+'/';const ld=x.ld||x.h;
  const ic=x.logoUrl?`<img src="${x.logoUrl}" alt="" loading="lazy" data-d="${ld}" data-c="${x.c}" data-i="${esc(x.abbr||initial(x.n))}" onerror="fbk(this)">`
    :x.abbr?`<span class="chip" style="background:${x.c};font-size:${chipFont(x.abbr)}">${esc(x.abbr)}</span>`
    :`<img src="https://icon.horse/icon/${ld}" alt="" loading="lazy" data-d="${ld}" data-c="${x.c}" data-i="${initial(x.n)}" onerror="fbk(this)">`;
  return `<a class="cc" href="${url}" target="_blank" rel="noopener" style="--bc:${x.c}">
    <span class="ic">${ic}</span>
    <span class="info"><span class="nm">${esc(x.n)}</span><span class="sub">${esc(x.s)} · ${esc(x.h)}</span></span>
    <span class="go">↗</span></a>`;}
function render(){const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const secs=CATS.filter(c=>c.k!=='all');let shown=0,html='';
  for(const sc of secs){ if(TAB!=='all'&&TAB!==sc.k)continue;
    let items=C.filter(x=>x.cat===sc.k); if(q)items=items.filter(x=>(x.n+' '+x.s+' '+x.h).toLowerCase().includes(q));
    if(!items.length)continue; shown+=items.length;
    html+=`<div class="sec"><h2>${sc.t}<span class="badge">${items.length}</span></h2><div class="grid">${items.map(card).join('')}</div></div>`;}
  if(!shown)html=`<div class="empty">검색 결과가 없습니다.</div>`;
  document.getElementById('list').innerHTML=html;
  document.getElementById('cnt').textContent='총 '+C.length+'개 선사·항공사'+(q?(' · 검색 '+shown+'개'):'');}
function renderTabs(){document.getElementById('tabs').innerHTML=CATS.map(c=>{
  const n=c.k==='all'?C.length:C.filter(x=>x.cat===c.k).length;
  return `<button class="${TAB===c.k?'on':''}" onclick="TAB='${c.k}';renderTabs();render()">${c.t} ${n}</button>`;}).join('');}
renderTabs(); render();
</script>
