<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하멜코리아 · 견적 허브</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f7;--panel:#ffffff;--panel2:#f2f5f9;--line:#dae1ea;--txt:#17202b;--mut:#54637a;--mut2:#8592a4;
--accent:#2563eb;--win:#16a34a;--loss:#dc2626;--amber:#b45309;--b:#7c5cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",Arial,sans-serif;font-size:13.5px}
.app{display:flex;min-height:100vh}
.side{width:210px;background:var(--panel);border-right:1px solid var(--line);flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .logo{padding:16px 18px;border-bottom:1px solid var(--line)}
.side .logo b{font-size:15px}
.side .logo div{font-size:11px;color:var(--mut2);margin-top:2px}
.side nav{padding:8px;flex:1;overflow:auto}
.side nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--mut);cursor:pointer;font-size:13.5px;font-weight:500;text-decoration:none;margin:2px 0}
.side nav a:hover{background:var(--panel2)}
.side nav a.active{background:var(--accent);color:#fff;font-weight:600}
.side .conn{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mut2);vertical-align:0}
.dot.ok{background:var(--win)}.dot.bad{background:var(--loss)}
.main{flex:1;min-width:0;padding:20px 24px;max-width:1500px}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut2);font-size:12px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .l{font-size:11px;color:var(--mut);margin-bottom:6px}.kpi .v{font-size:21px;font-weight:750}
.kpi .n{font-size:11px;color:var(--mut2);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05)}
.card h3{margin:0 0 3px;font-size:14px}.card .d{color:var(--mut2);font-size:11.5px;margin-bottom:12px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.win{background:var(--win);border-color:var(--win);color:#fff}.btn.sm{padding:4px 9px;font-size:11.5px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#fff;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{color:var(--mut2);font-size:11px;text-transform:uppercase}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.st-접수{background:rgba(133,146,164,.18);color:var(--mut)}
.st-견적중{background:rgba(37,99,235,.13);color:var(--accent)}
.st-제출{background:rgba(124,92,255,.15);color:var(--b)}
.st-협상{background:rgba(217,119,6,.15);color:var(--amber)}
.st-수주{background:rgba(22,163,74,.15);color:var(--win)}.st-실주{background:rgba(220,38,38,.12);color:var(--loss)}
.st-보류,.st-취소{background:rgba(133,146,164,.14);color:var(--mut2)}
.st-부킹{background:rgba(22,163,74,.16);color:var(--win)}
tr.grp td{background:var(--panel2);font-weight:700;font-size:12px;color:var(--txt);padding:9px 10px;border-top:2px solid var(--line)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.qc{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;cursor:pointer;font-size:12px}
.qc:hover{border-color:var(--accent)}.qc b{font-size:12.5px}.qc .m{color:var(--mut2);font-size:11px;margin-top:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
.fld label{font-size:11px;color:var(--mut2)}.fld.miss input,.fld.miss select{border-color:var(--amber)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--accent);border-radius:9px;padding:12px 16px;font-size:13px;box-shadow:0 8px 28px rgba(20,30,50,.16);z-index:99;max-width:360px}
.toast.err{border-color:var(--loss)}
.empty{padding:44px;text-align:center;color:var(--mut2)}
#modal{display:none;position:fixed;inset:0;z-index:100}
.modal-bg{position:absolute;inset:0;background:#000b}
.modal-box{position:relative;max-width:760px;margin:5vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-height:88vh;overflow:auto}
.tools{border-top:1px solid var(--line);padding:10px 10px 6px}
.tools-h{font-size:11px;color:var(--mut2);margin-bottom:8px;font-weight:600}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tools-grid a{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 3px;font-size:11px;color:var(--mut);cursor:pointer;text-align:center;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools-grid a:hover{border-color:var(--accent);color:var(--txt)}
.syslink{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:9px 10px;font-size:12px;text-decoration:none;font-weight:700;border:1px solid transparent;margin-bottom:6px;letter-spacing:.2px}
.syslink:hover{filter:brightness(1.05);transform:translateY(-1px)}
.syslink.hamel{background:#243f8f;color:#fff;border-color:#1c336f}      /* HAMEL 블루 */
.syslink.moqv{background:#fff;color:#111;border-color:#f2911e}          /* MOQV 화이트+오렌지 */
.syslink.moqv .qm{color:#f2911e;font-weight:800}
.syslink.moqv:hover{background:#fff7ee}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.badge.auto{background:rgba(22,163,74,.13);color:var(--win);font-size:10px;padding:1px 6px;border-radius:20px}
.copybox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px}
.copybox pre{margin:0;white-space:pre-wrap;font-size:12px;line-height:1.6}
.intakeGrid{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start;margin-bottom:16px}
.mailcard{position:sticky;top:16px}
.mailcard textarea{min-height:300px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 16px;align-items:start}
.formgrid .full{grid-column:1/-1}
.formgrid .fld{gap:5px;min-width:0}
.formgrid .fld label{font-size:11.5px;color:var(--mut);font-weight:600}
.formgrid .fld input,.formgrid .fld select,.cnt4 .fld input{width:100%}
.fsec{grid-column:1/-1;font-size:12px;color:var(--txt);font-weight:700;letter-spacing:.2px;margin:9px 0 0;padding-bottom:6px;border-bottom:2px solid var(--line)}
.fsec:first-child{margin-top:0}
.cnt4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cnt4 .fld{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--txt);font-weight:500;flex:1;min-width:56px;text-align:center}
.segb:hover{border-color:var(--accent)}
.segb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ac{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;z-index:30;background:#fff;border:1px solid var(--accent);border-top:none;border-radius:0 0 8px 8px;max-height:264px;overflow-y:auto;box-shadow:0 10px 22px rgba(20,30,50,.14)}
.ac-item{padding:8px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--panel2);color:var(--accent)}
.ac-item.ac-add{color:var(--win);font-weight:600;background:rgba(22,163,74,.06)}
.cap{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:6px}
.crowhead,.crow{display:grid;grid-template-columns:1fr 1fr 1fr 0.7fr 0.9fr 68px 30px;gap:6px;align-items:center}
.crowhead{font-size:10.5px;color:var(--mut);margin-bottom:4px}
.crow{margin-bottom:6px}
.crow input{width:100%}
.cgcbm{font-size:12px;color:var(--txt);text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cmx{display:grid;grid-template-columns:96px 1fr 1fr;gap:6px 10px;align-items:center;max-width:420px}
.cmxh{font-size:10.5px;color:var(--mut);text-align:center}
.cmxl{font-size:12px;color:var(--txt);font-weight:600}
.cmx input{width:100%;text-align:center}
@media(max-width:640px){.crowhead,.crow{grid-template-columns:1fr 1fr 1fr 0.7fr 0.9fr 56px 26px}}
.doorbar{display:flex;align-items:center;gap:8px;border:1px dashed var(--accent);border-radius:8px;padding:9px 12px;background:rgba(37,99,235,.05);cursor:pointer;font-size:13px;font-weight:600;color:var(--txt)}
.doorbox{border:1px solid var(--accent);border-radius:9px;padding:12px;background:rgba(37,99,235,.05);display:grid;gap:10px}
.qline input,.qline select{padding:6px 8px}
table.kvt{width:100%;border-collapse:collapse}
table.kvt th.kv{background:var(--panel2);color:var(--mut);font-weight:600;font-size:11.5px;text-transform:none;width:92px;white-space:nowrap;text-align:left;border:1px solid var(--line);padding:7px 9px}
table.kvt td{font-size:13px;border:1px solid var(--line);padding:7px 9px;vertical-align:top}
.pchip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 6px;font-size:12px;cursor:pointer;color:var(--txt);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pchip.on .tag{background:rgba(255,255,255,.25);color:#fff}
.spbox{border:1px solid var(--amber);border-radius:9px;padding:11px;background:rgba(180,83,9,.06)}
/* ── 적재 상세(ld) 레이아웃 · 스퀴즈 ── */
.ld-ih{--ldih:34px;--ldg:7px}
.ld-cm{display:grid;grid-template-columns:3fr 1fr;gap:7px;align-items:end}
.ld-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;margin-top:2px}
.ld-sub{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--panel2);display:flex;flex-direction:column}
.ld-sub h4{margin:0 0 9px;font-size:12px;font-weight:750;display:flex;align-items:center;gap:6px}
.ld-cg{display:grid;grid-template-columns:66px 1fr 1fr 78px;gap:7px;align-items:center}
.ld-cg .h{font-size:10px;font-weight:700;color:var(--mut);text-align:center}
.ld-cg .l{font-size:11.5px;font-weight:700}
.ld-cg input{height:34px;text-align:center;padding:0 4px;width:100%}
.ld-cg .wt input{text-align:right;padding:0 7px}
.ld-dg{display:flex;align-items:center;gap:7px;height:34px;margin-top:7px;padding:0 9px;border:1px dashed var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.ld-dg.on{border-color:var(--loss);background:rgba(220,38,38,.06);color:var(--loss)}
.ld-dg input{width:auto;height:auto;margin:0}
.ld-dgf{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.ld-dgf input{height:34px;width:100%}
.ld-chips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ld-chip{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;user-select:none}
.ld-chip.on{background:rgba(180,83,9,.08);border-color:#fdba74;color:#b45309}
.ld-chip.on.rf{background:rgba(37,99,235,.08);border-color:#93c5fd;color:#1d4ed8}
.ld-chip input{display:none}
.ld-rf{margin-top:7px;border:1px solid #bfdbfe;background:rgba(37,99,235,.05);border-radius:8px;padding:9px}
.ld-rf .g{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ld-rf label{font-size:10.5px;font-weight:600;color:#1d4ed8;display:block;margin-bottom:4px}
.ld-rf input{height:34px;width:100%}
.ld-memo{margin-top:7px;flex:1;display:flex;flex-direction:column}
.ld-memo label{font-size:10.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.ld-memo textarea{flex:1;min-height:58px;width:100%}
.ld-grow{flex:1}
.ld-note{font-size:10.5px;color:var(--mut2);margin:8px 0 0}
.ld-dim{margin-top:12px;border:1.5px solid var(--loss);border-radius:10px;padding:11px 12px;background:rgba(220,38,38,.05)}
.ld-dim.ok{border-color:#86efac;background:rgba(22,163,74,.06)}
.ld-dim.soft{border-style:solid;border-color:var(--line);background:var(--panel2)}
.ld-dim h5{margin:0 0 8px;font-size:11.5px;font-weight:750;color:var(--loss);display:flex;align-items:center;gap:6px}
.ld-dim.ok h5{color:var(--win)}.ld-dim.soft h5{color:var(--txt)}
@media(max-width:720px){.ld-two{grid-template-columns:1fr}}
.saverow{display:flex;gap:12px;align-items:center;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:960px){.intakeGrid{grid-template-columns:1fr}.mailcard{position:static}.mailcard textarea{min-height:150px}}
@media(max-width:640px){.formgrid{grid-template-columns:1fr}.cnt4{grid-template-columns:repeat(2,1fr)}}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.note.done{opacity:.55}.note.done .nb{text-decoration:line-through}
.nc-지시{border-left:3px solid var(--loss)}.nc-공지{border-left:3px solid var(--accent)}.nc-메모{border-left:3px solid var(--mut2)}
.delta-up{color:var(--win);font-weight:700}.delta-dn{color:var(--loss);font-weight:700}
.mono{font-variant-numeric:tabular-nums}
tr.stale td{background:rgba(180,83,9,.08)}
@media(max-width:1100px){.mgrid{grid-template-columns:1fr}}
@media print{.side,.tools,#toastHost,.noprint,.navToggle{display:none!important}.app{display:block}.main{max-width:none;padding:0}.card{break-inside:avoid;box-shadow:none}body{font-size:12px}h2{font-size:16px}}
.navToggle{display:none;position:fixed;top:10px;left:10px;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(20,30,50,.14)}
@media(max-width:860px){
  .navToggle{display:block}
  .side{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);transition:transform .2s ease;z-index:55;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .main{padding:54px 14px 24px}
  .kpis{grid-template-columns:repeat(2,1fr)!important}
  .mgrid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<button id="navToggle" class="navToggle" onclick="document.querySelector('.side').classList.toggle('open')">☰</button>
<div class="app">
  <aside class="side">
    <div class="logo"><b>하멜 · 견적 허브</b><div>Inquiry → RFQ → 견적 → 복기</div></div>
    <nav id="nav">
      <a data-v="dashboard" class="active">📊 대시보드</a>

        <a href="https://www.forwarder.kr/freight/index/scfi" target="_blank" rel="noopener">📊 운임지수</a>

        <a href="https://www.forwarder.kr/tariff" target="_blank" rel="noopener">🚛 안전운임</a>
        <a href="https://www.forwarder.kr/curr/surcharge.php" target="_blank" rel="noopener">📋 부대비용</a>
        <a onclick="openPartners()" style="cursor:pointer">🤝 Partners</a>
      </div>
    </div>
    <div class="conn"><span id="dot" class="dot"></span><span id="connTxt">연결 확인 중…</span></div>
  </aside>
  <main class="main" id="main"><div class="empty">로딩 중…</div></main>
</div>
<div id="toastHost"></div>
<div id="modal"></div>

<script>

const STAGES=["접수","견적중","제출","협상","수주","실주","보류","취소"];
const STAFF=["안진오","권영재","김도현","노희수","김진아","전예지"];
const OPEN=["접수","견적중","제출","협상"];
const WEIGHT={"접수":0.1,"견적중":0.25,"제출":0.5,"협상":0.75,"수주":1};
const CH=["LOCAL","OVERSEA","NOMI","PARTNER","공공입찰"];

/* ================= 유틸 ================= */
const $=s=>document.querySelector(s);
function toast(msg,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg;
  document.getElementById('toastHost').appendChild(t); setTimeout(()=>t.remove(),err?5000:2500); }
function fmtW(v){ v=+v||0; if(Math.abs(v)>=1e8)return (v/1e8).toFixed(1)+'억'; if(Math.abs(v)>=1e4)return Math.round(v/1e4).toLocaleString()+'만'; return Math.round(v).toLocaleString(); }
function pct(v){ return v==null?'–':(v*100).toFixed(1)+'%'; }
let FX={USD:1350,EUR:1450,CNY:190,KRW:1};
const fxToKRW=(amt,cur)=>(+amt||0)*(FX[(cur||'KRW').toUpperCase()]||1);
async function loadFX(){ try{ const rows=await q('app_settings'); rows.forEach(r=>{ if(r.key==='fx_usd')FX.USD=+r.value||FX.USD; if(r.key==='fx_eur')FX.EUR=+r.value||FX.EUR; if(r.key==='fx_cny')FX.CNY=+r.value||FX.CNY; }); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function q(table,build){ if(!SB) throw new Error('no client'); let r=SB.from(table).select('*'); if(build)r=build(r); const {data,error}=await r; if(error)throw error; return data||[]; }

/* ================= 연결 확인 ================= */
async function checkConn(){
  try{ const {error}=await SB.from('regions').select('code').limit(1); if(error)throw error;
    $('#dot').className='dot ok'; $('#connTxt').textContent='Supabase 연결됨'; return true;
  }catch(e){ $('#dot').className='dot bad'; $('#connTxt').textContent='연결 실패 — 인터넷/키 확인'; return false; }
}

/* ================= 라우터 ================= */
const VIEWS={};
let CURRENT='dashboard';
function go(v){ CURRENT=v; document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));
  $('#main').innerHTML='<div class="empty">불러오는 중…</div>'; (VIEWS[v]||(()=>{}))(); }
document.querySelectorAll('#nav a').forEach(a=>a.addEventListener('click',()=>{ go(a.dataset.v); document.querySelector('.side').classList.remove('open'); }));

/* ================= 대시보드 (월간 실적 장표) ================= */
let DASH={m:null};
const ym=d=>String(d||'').slice(0,7);
function monthsBack(mk,n){ let [y,m]=mk.split('-').map(Number); const out=[]; for(let i=n-1;i>=0;i--){ let mm=m-i,yy=y; while(mm<=0){mm+=12;yy--;} out.push(yy+'-'+String(mm).padStart(2,'0')); } return out; }
function deltaHTML(cur,prev){ if(prev==null||prev===0||cur==null)return ''; const d=(cur-prev)/Math.abs(prev),up=d>=0; return `<span class="${up?'delta-up':'delta-dn'}">${up?'▲':'▼'}${(Math.abs(d)*100).toFixed(0)}%</span>`; }
VIEWS.dashboard=async function(){
  $('#main').innerHTML='<div class="empty">불러오는 중…</div>';
  try{
    DASH.bk=await q('bookings'); DASH.reqs=await q('quote_requests');
    try{ DASH.notes=await q('board_notes',b=>b.order('created_at',{ascending:false}).limit(100)); }catch(e){ DASH.notes=[]; }
    const ms=[...new Set([...DASH.bk.map(b=>ym(b.bkg_date)),...DASH.reqs.map(r=>ym(r.created_at))].filter(Boolean))].sort();
    const nowM=new Date().toISOString().slice(0,7);
    if(!DASH.m) DASH.m=ms.includes(nowM)?nowM:(ms[ms.length-1]||nowM);
    renderDash(ms);
  }catch(e){ $('#main').innerHTML=`<h2>월간 실적 장표</h2><div class="card"><div class="empty">데이터를 불러오지 못했습니다.<br>${esc(e.message||e)}</div></div>`; }
};
window.setDashMonth=function(m){ DASH.m=m; renderDash(); };
function renderDash(ms){
  ms=ms||DASH._ms; DASH._ms=ms;
  const bk=DASH.bk, reqs=DASH.reqs, M=DASH.m;
  const bkM=k=>bk.filter(b=>ym(b.bkg_date)===k), reqM=k=>reqs.filter(r=>ym(r.created_at)===k);
  const met=k=>{ const B=bkM(k),R=reqM(k);
    const rev=B.reduce((a,b)=>a+(+b.revenue||0),0),mgn=B.reduce((a,b)=>a+(+b.margin||0),0);
    const won=R.filter(r=>r.stage==='수주').length,lost=R.filter(r=>r.stage==='실주').length;
    return {bkN:B.length,rev,mgn,mrate:rev?mgn/rev:null,reqN:R.length,won,lost,hit:(won+lost)?won/(won+lost):null}; };
  const cur=met(M);
  const pk=(()=>{let [y,m]=M.split('-').map(Number);m--;if(m<=0){m=12;y--;}return y+'-'+String(m).padStart(2,'0');})();
  const prev=met(pk);
  const trend=monthsBack(M,6).map(k=>({k,...met(k)})); const maxRev=Math.max(1,...trend.map(t=>t.rev));
  const tile=(l,v,n)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
  const bySales={}; bkM(M).forEach(b=>{const s=b.sales||'(미지정)';(bySales[s]=bySales[s]||{n:0,rev:0,mgn:0});bySales[s].n++;bySales[s].rev+=+b.revenue||0;bySales[s].mgn+=+b.margin||0;});
  const salesRows=Object.entries(bySales).sort((a,b)=>b[1].rev-a[1].rev);
  const today=new Date(); const daysSince=d=>Math.floor((today-new Date(d))/86400000);
  const openReqs=reqs.filter(r=>OPEN.includes(r.stage||'접수')).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const liveBk=bk.filter(b=>ym(b.bkg_date)>=M).sort((a,b)=>String(b.bkg_date).localeCompare(String(a.bkg_date))).slice(0,15);
  const monthOpts=ms.map(m=>`<option${m===M?' selected':''}>${m}</option>`).join('');
  $('#main').innerHTML=`
   <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
     <div><h2 style="margin:0">월간 실적 장표</h2><div class="sub" style="margin:2px 0 0">회의용 정형 장표 · 전 직원 공유 · 실시간</div></div>
     <div class="row noprint"><span class="d" style="margin:0">기준월</span><select onchange="setDashMonth(this.value)">${monthOpts}</select><button class="btn" onclick="window.print()">🖨 장표 인쇄</button></div>
   </div>
   <div class="kpis">
     ${tile('부킹 건수',cur.bkN+'건',`전월 ${prev.bkN} ${deltaHTML(cur.bkN,prev.bkN)}`)}
     ${tile('매출',fmtW(cur.rev)+'원',`전월대비 ${deltaHTML(cur.rev,prev.rev)}`)}
     ${tile('마진',fmtW(cur.mgn)+'원',`전월대비 ${deltaHTML(cur.mgn,prev.mgn)}`)}
     ${tile('마진율',cur.mrate==null?'–':(cur.mrate*100).toFixed(1)+'%',`전월 ${prev.mrate==null?'–':(prev.mrate*100).toFixed(1)+'%'}`)}
     ${tile('인콰이어리 접수',cur.reqN+'건','이번 달 신규')}
     ${tile('수주 / 승률',cur.won+'건',`승률 ${pct(cur.hit)} (${cur.won}/${cur.won+cur.lost})`)}
   </div>
   <div class="card"><h3>월별 추이 <span class="d" style="display:inline">— 최근 6개월 (${M} 기준)</span></h3>
     <div style="overflow:auto"><table><thead><tr><th>월</th><th class="num">부킹</th><th class="num">매출</th><th class="num">마진</th><th class="num">마진율</th><th class="num">인콰이어리</th><th class="num">수주</th><th class="num">승률</th><th style="width:110px">매출</th></tr></thead><tbody>
       ${trend.map(t=>`<tr${t.k===M?' style="background:rgba(37,99,235,.06);font-weight:600"':''}><td class="mono">${t.k}</td><td class="num mono">${t.bkN}</td><td class="num mono">${fmtW(t.rev)}</td><td class="num mono">${fmtW(t.mgn)}</td><td class="num mono">${t.mrate==null?'–':(t.mrate*100).toFixed(1)+'%'}</td><td class="num mono">${t.reqN}</td><td class="num mono">${t.won}</td><td class="num mono">${pct(t.hit)}</td>
         <td><div style="background:var(--panel2);border-radius:5px;height:13px"><div style="height:100%;border-radius:5px;background:var(--accent);width:${Math.round(t.rev/maxRev*100)}%"></div></div></td></tr>`).join('')}
     </tbody></table></div></div>
   <div class="mgrid">
     <div class="card"><h3>담당자별 실적 <span class="d" style="display:inline">— ${M}</span></h3>
       ${salesRows.length?`<table><thead><tr><th>담당</th><th class="num">부킹</th><th class="num">매출</th><th class="num">마진</th><th class="num">마진율</th></tr></thead><tbody>
         ${salesRows.map(([s,v])=>`<tr><td><b>${esc(s)}</b></td><td class="num mono">${v.n}</td><td class="num mono">${fmtW(v.rev)}</td><td class="num mono">${fmtW(v.mgn)}</td><td class="num mono">${v.rev?(v.mgn/v.rev*100).toFixed(1)+'%':'–'}</td></tr>`).join('')}
       </tbody></table>`:'<div class="d">이 달 부킹 데이터가 없습니다.</div>'}</div>
     <div class="card"><h3>단계별 진행 인콰이어리 <span class="d" style="display:inline">— 현재</span></h3>
       ${OPEN.concat(['수주','실주']).map(s=>{const n=reqs.filter(r=>(r.stage||'접수')===s).length;return `<div class="row" style="margin:6px 0"><div style="width:56px;color:var(--mut)">${s}</div><div style="flex:1;background:var(--panel2);border-radius:6px;height:18px"><div style="height:100%;border-radius:6px;background:${s==='수주'?'var(--win)':s==='실주'?'var(--loss)':'var(--accent)'};width:${Math.min(n*20,100)}%"></div></div><div style="width:34px;text-align:right" class="mono">${n}</div></div>`;}).join('')}</div>
   </div>
   <div class="card"><h3>🔴 현행 인콰이어리 현황 <span class="pill">${openReqs.length}</span> <span class="d" style="display:inline">— 진행중 · 오래된 순 (7일↑ 경고)</span></h3>
     ${openReqs.length?`<div style="overflow:auto;max-height:340px"><table><thead><tr><th>경과</th><th>Job#</th><th>화주</th><th>레인</th><th>채널</th><th>담당</th><th>단계</th><th class="num">견적</th></tr></thead><tbody>
       ${openReqs.slice(0,40).map(r=>{const dd=daysSince(r.created_at);return `<tr class="${dd>=7?'stale':''}" style="cursor:pointer" onclick="openReq('${r.id}')"><td class="mono" style="${dd>=7?'color:var(--loss);font-weight:700':'color:var(--mut)'}">${dd}일</td><td style="color:var(--accent);font-weight:700;white-space:nowrap">${esc(r.job_no||'')}</td><td>${esc(r.shipper||'')}</td><td style="white-space:nowrap">${esc(r.origin_port||'?')}→${esc(r.dest_port||'?')}</td><td>${esc(r.channel||'')}</td><td>${esc(r.owner||r.assigned_to||'')}</td><td><span class="tag st-${r.stage||'접수'}">${r.stage||'접수'}</span></td><td class="num mono">${r.sell_krw?fmtW(r.sell_krw):'–'}</td></tr>`;}).join('')}
     </tbody></table></div>`:'<div class="d">진행중 인콰이어리가 없습니다.</div>'}</div>
   <div class="card"><h3>🚢 현행·예정 부킹 <span class="d" style="display:inline">— ${M} 이후 · 최근 15건</span></h3>
     ${liveBk.length?`<div style="overflow:auto;max-height:340px"><table><thead><tr><th>주차</th><th>BKG#</th><th>ETD</th><th>화주</th><th>레인</th><th>담당</th><th class="num">매출</th><th class="num">마진</th></tr></thead><tbody>
       ${liveBk.map(b=>`<tr><td class="mono">${b.wk||''}</td><td>${esc(b.bkg_no||'')}</td><td class="mono" style="white-space:nowrap">${esc(b.bkg_date||'')}</td><td>${esc(b.shipper||'')}</td><td style="white-space:nowrap">${esc(b.pol||'?')}→${esc(b.pod||'?')}</td><td>${esc(b.sales||'')}</td><td class="num mono">${b.revenue?fmtW(b.revenue):'–'}</td><td class="num mono">${b.margin?fmtW(b.margin):'–'}</td></tr>`).join('')}
     </tbody></table></div>`:'<div class="d">해당 기간 부킹이 없습니다.</div>'}</div>
   <div class="card"><h3>📌 지시 · 메모 보드 <span class="d" style="display:inline">— 전 직원 공유 · 회의 대체</span></h3>
     <div class="row noprint" style="margin-bottom:12px">
       <select id="ntCat">${['메모','지시','공지'].map(c=>`<option>${c}</option>`).join('')}</select>
       <select id="ntAuthor"><option value="">작성자</option>${STAFF.map(s=>`<option>${s}</option>`).join('')}</select>
       <select id="ntAssignee"><option value="">대상(전체)</option>${STAFF.map(s=>`<option>${s}</option>`).join('')}</select>
       <input id="ntBody" placeholder="지시/메모 내용 입력 후 Enter 또는 등록" style="flex:1;min-width:220px" onkeydown="if(event.key==='Enter')addNote()">
       <button class="btn primary" onclick="addNote()">등록</button>
     </div>
     <div id="noteList"></div></div>`;
  renderNotes();
}
function renderNotes(){
  const el=$('#noteList'); if(!el)return; const ns=DASH.notes||[];
  if(!ns.length){ el.innerHTML='<div class="d">등록된 지시·메모가 없습니다. 위에서 첫 메모를 남겨보세요.</div>'; return; }
  el.innerHTML=ns.map(n=>{const d=String(n.created_at||'').replace('T',' ').slice(5,16);
    return `<div class="note nc-${n.category||'메모'}${n.done?' done':''}">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <span class="tag ${n.category==='지시'?'st-실주':n.category==='공지'?'st-접수':'st-보류'}">${esc(n.category||'메모')}</span>
          <span class="nb" style="margin-left:6px">${esc(n.body||'')}</span>
          <div class="d" style="margin:4px 0 0">${esc(n.author||'?')}${n.assignee?` → <b style="color:var(--txt)">${esc(n.assignee)}</b>`:''} · ${esc(d)}</div>
        </div>
        <div class="row noprint" style="gap:6px">
          <button class="btn sm" onclick="toggleNote('${n.id}',${n.done?'false':'true'})">${n.done?'되돌리기':'완료'}</button>
          <button class="btn sm" onclick="delNote('${n.id}')">삭제</button>
        </div>
      </div></div>`;}).join('');
}
window.addNote=async function(){
  const body=($('#ntBody')?.value||'').trim(); if(!body){toast('내용을 입력하세요',true);return;}
  const row={category:$('#ntCat').value,author:$('#ntAuthor').value||null,assignee:$('#ntAssignee').value||null,body,done:false};
  try{ const {error}=await SB.from('board_notes').insert(row); if(error)throw error;
    DASH.notes=await q('board_notes',b=>b.order('created_at',{ascending:false}).limit(100)); $('#ntBody').value=''; renderNotes(); toast('등록됨');
  }catch(e){ toast(e.message||e,true); }
};
window.toggleNote=async function(id,done){ const v=(done==='true'||done===true); try{ const {error}=await SB.from('board_notes').update({done:v}).eq('id',id); if(error)throw error; const n=(DASH.notes||[]).find(x=>x.id===id); if(n)n.done=v; renderNotes(); }catch(e){ toast(e.message||e,true); } };
window.delNote=async function(id){ try{ const {error}=await SB.from('board_notes').delete().eq('id',id); if(error)throw error; DASH.notes=(DASH.notes||[]).filter(x=>x.id!==id); renderNotes(); }catch(e){ toast(e.message||e,true); } };

/* ================= 파이프라인 (요약 + 표) ================= */
let PIPE=[], PIPEF={stage:''};
VIEWS.pipeline=async function(){
  $('#main').innerHTML='<div class="empty">불러오는 중…</div>';
  try{ PIPE=await q('quote_requests',r=>r.order('created_at',{ascending:false})); renderPipe(); }
  catch(e){ $('#main').innerHTML=`<h2>파이프라인</h2><div class="card"><div class="empty">${esc(e.message||e)}</div></div>`; }
};
window.setPipeStage=function(s){ PIPEF.stage=(PIPEF.stage===s?'':s); renderPipe(); };
function renderPipe(){
  const reqs=PIPE; const cnt=s=>reqs.filter(r=>(r.stage||'접수')===s).length;
  const today=new Date(); const days=d=>Math.floor((today-new Date(d))/86400000);
  const kw=($('#pq')?.value||'').trim().toLowerCase();
  let list=reqs.filter(r=>{ if(PIPEF.stage&&(r.stage||'접수')!==PIPEF.stage)return false;
    if(kw&&!((r.job_no||'')+(r.shipper||'')+(r.origin_port||'')+(r.dest_port||'')+(r.channel||'')+(r.owner||'')).toLowerCase().includes(kw))return false; return true; });
  const openN=reqs.filter(r=>OPEN.includes(r.stage||'접수')).length, won=cnt('수주'), lost=cnt('실주');
  const hit=(won+lost)?won/(won+lost):null;
  const pipeVal=reqs.filter(r=>OPEN.includes(r.stage||'접수')).reduce((a,r)=>a+((+r.sell_krw||0)*(WEIGHT[r.stage||'접수']||0)),0);
  const tile=(l,v,n)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
  const chip=s=>`<button class="pchip${PIPEF.stage===s?' on':''}" onclick="setPipeStage('${s}')"><span class="tag st-${s}" style="padding:1px 7px">${s}</span> <b>${cnt(s)}</b></button>`;
  $('#main').innerHTML=`<h2>파이프라인</h2><div class="sub">상단 단계별 요약 → 아래 상세 표 · 행 클릭 시 Job 상세</div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      ${tile('진행중',openN+'건','오픈 인콰이어리')}
      ${tile('가중 파이프라인',fmtW(pipeVal)+'원','기대매출')}
      ${tile('수주 / 실주',won+' / '+lost,'승률 '+pct(hit))}
      ${tile('전체 Job',reqs.length+'건','누적')}
    </div>
    <div class="card"><div class="cap" style="margin-bottom:8px">단계 필터 (클릭)</div><div class="row" style="gap:6px;flex-wrap:wrap">${STAGES.map(chip).join('')}${PIPEF.stage?`<button class="btn sm" onclick="setPipeStage('${PIPEF.stage}')">필터해제</button>`:''}</div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><input id="pq" placeholder="Job#·화주·레인·거래구분·담당 검색" style="flex:1;min-width:220px" oninput="renderPipe()"><span class="pill">${list.length}건</span></div>
      <div style="overflow:auto;max-height:64vh"><table><thead><tr><th>Job#</th><th>단계</th><th>거래구분</th><th>운송</th><th>화주</th><th>레인</th><th>담당</th><th class="num">Sell</th><th>마감</th><th class="num">경과</th></tr></thead><tbody>
      ${list.map(r=>{const dd=days(r.created_at);const st=r.stage||'접수';return `<tr style="cursor:pointer" onclick="openReq('${r.id}')">
        <td style="color:var(--accent);font-weight:700;white-space:nowrap">${esc(r.job_no||'')}</td>
        <td><span class="tag st-${st}">${st}</span></td>
        <td>${esc(r.channel||'')}</td>
        <td style="white-space:nowrap">${esc(r.ship_kind||'')}${(r.is_oog||r.is_fr||r.is_rf)?` <span style="color:var(--amber);font-size:10px">${[r.is_oog?'OOG':'',r.is_fr?'FR':'',r.is_rf?'RF':''].filter(Boolean).join('·')}</span>`:''}</td>
        <td><b>${esc(r.shipper||'')}</b>${r.shipper_contact?`<div class="d" style="margin:0">${esc(r.shipper_contact)}</div>`:''}</td>

function vmModeKinds(r){

function findPorts(t){ const f=[]; for(const k in PORTS){let i=t.indexOf(k);while(i>=0){f.push({p:i,port:PORTS[k]});i=t.indexOf(k,i+1);}}
  const up=t.toUpperCase(); PORT_EN.forEach(p=>{let i=up.indexOf(p);while(i>=0){f.push({p:i,port:p==='JEBEL'?'JEBEL ALI':p});i=up.indexOf(p,i+1);}});
  f.sort((a,b)=>a.p-b.p); const u=[]; f.forEach(x=>{if(!u.some(y=>y.port===x.port&&Math.abs(y.p-x.p)<3))u.push(x);}); return u; }
function num(v){ if(v==null)return null; const s=String(v).replace(/[,\s₩]/g,'').replace(/%$/,''); if(s==='')return null; const n=parseFloat(s); return isNaN(n)?null:n; }
function parseInq(t){
  const o={stage:'접수'};
  o.channel = /입찰|공고|나라장터|조달|공단/.test(t)?'공공입찰' : /nomi|노미|지정/i.test(t)?'NOMI' : /해외|oversea|삼국간|현지|co-?load|코로드/i.test(t)?'OVERSEA' : /파트너|partner/i.test(t)?'PARTNER' : 'LOCAL';
  o.ship_kind = /항공|air|에어/i.test(t)?'항공' : /특송|courier|express|dhl|fedex|국제특송/i.test(t)?'특송' : /콘솔|lcl/i.test(t)?'콘솔' : /벌크|중량물|break\s*bulk|초중량|bbk|프로젝트/i.test(t)?'벌크' : /내륙|트럭|육상|domestic/i.test(t)?'내륙운송' : '해상';
  const mode=/항공|air|에어/i.test(t)?'AIR':'SEA';
  o.direction=/수입|import|반입/i.test(t)?'IMPORT':'EXPORT';
  if(/lcl|콘솔/i.test(t))o.cargo_type='LCL'; else if(/로로|ro-?ro/i.test(t))o.cargo_type='RORO';
  else if(o.ship_kind==='벌크'||/벌크|중량물|bulk/i.test(t))o.cargo_type='BB'; else if(mode==='AIR')o.cargo_type='AIR'; else o.cargo_type='FCL';
  const inc=t.match(/\b(FOB|CIF|CFR|CNF|EXW|DAP|DDP|CIP|FCA)\b/i); if(inc)o.incoterms=inc[1].toUpperCase().replace('CNF','CFR');
  const ps=findPorts(t); if(ps[0])o.origin_port=ps[0].port; if(ps[1])o.dest_port=ps[1].port;
  const hm=t.match(/(?:화주|shipper|고객사?|업체|발주처|발주기관)\s*[:：]?\s*([가-힣A-Za-z0-9()㈜]{2,20})/);
  if(hm)o.shipper=hm[1].replace(/(이고|입니다|은|는|이|가)$/,'');
  else{const c=t.match(/([가-힣A-Za-z0-9]{2,12}(?:㈜|\(주\)|주식회사|물류|통운|산업|중공업|건설|식품|전자|화학|해운|비전|인더스트리|공사|공단))/);if(c)o.shipper=c[1];}
  const w=t.match(/([0-9][0-9,\.]*)\s*(톤|ton|t\b|mt)/i); if(w)o.weight=w[1].replace(/,/g,'')+'T';
  const dim=t.match(/([0-9]+(?:\.[0-9]+)?)\s*[x×*]\s*([0-9]+(?:\.[0-9]+)?)\s*[x×*]\s*([0-9]+(?:\.[0-9]+)?)/); if(dim)o.dimensions=`${dim[1]}x${dim[2]}x${dim[3]}`;
  const money=n=>{const m=t.match(new RegExp('('+n+')[^0-9]{0,12}([0-9][0-9,\\.]{2,})\\s*(억|만)?','i'));if(!m)return null;let v=parseFloat(m[2].replace(/,/g,''));if(isNaN(v))return null;if(m[3]==='억')v*=1e8;else if(m[3]==='만')v*=1e4;return Math.round(v);};
  o.sell_krw=money('견적|운임|offer|sell|단가|금액');
  const dm=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)||t.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(dm)o.deadline=dm[0];
  o.notes=`[원문] ${t.slice(0,300)}\n[모드] ${mode} / ${o.direction}`;
  return o;
}

function parseCont(t,o){

function vendorPrice(d){
  if(d.total_price!=null&&d.total_price!=='') return {p:num(d.total_price),cur:d.total_currency};
  const qs=Array.isArray(d.quotes)?d.quotes:[];
  const allin=qs.find(q=>/all-?in|총액|합계/i.test(q.item||''));
  if(allin&&allin.price!=null) return {p:num(allin.price),cur:allin.currency};
  const priced=qs.filter(q=>q.price!=null&&q.price!=='');
  if(!priced.length) return {p:null,cur:null};
  const cur=priced[0].currency;
  const sameCur=priced.filter(q=>(q.currency||cur)===cur);
  const sum=sameCur.reduce((a,q)=>a+(num(q.price)||0),0);
  return {p:Math.round(sum),cur};
}

  $('#main').innerHTML=`<h2>히스토리 검색</h2><div class="sub">과거 견적 원장(공표가·실제가·수주/실주·사유) + 부킹 이력 · 화주/실화주·POL/POD·모드 구분</div>
   <div class="card"><div class="row"><input id="hq" placeholder="화주·POL·POD·선사 검색 (포트코드 가능, 예: KRPUS · USSAV)" style="flex:1;min-width:200px" oninput="histSearch()"><button class="btn" onclick="histSearch()">검색</button>
     <span class="d" style="margin:0 0 0 8px">모드</span>${['','SEA','AIR','LAND'].map(m=>`<button class="pchip${HMODE===m?' on':''}" onclick="HMODE='${m}';histSearch()">${m===''?'전체':MODEK[m]}</button>`).join('')}</div></div>
   <div id="histOut"><div class="empty">검색어를 입력하거나 그냥 검색을 누르세요</div></div>`;
  histSearch();
};
window.histSearch=async function(){
  const kw=($('#hq')?.value||'').trim();
  try{
    let hb=b=>b.order('apply_date',{ascending:false}).limit(300);
    if(kw) hb=b=>b.or(`shipper.ilike.%${kw}%,pod.ilike.%${kw}%,region.ilike.%${kw}%,carrier.ilike.%${kw}%`).order('apply_date',{ascending:false}).limit(300);
    const hist=await q('quote_history',hb);
    let bb=b=>b.order('bkg_date',{ascending:false}).limit(500);
    if(kw) bb=b=>b.or(`shipper.ilike.%${kw}%,pol.ilike.%${kw}%,pod.ilike.%${kw}%`).order('bkg_date',{ascending:false}).limit(500);
    let bk=await q('bookings',bb);
    if(HMODE) bk=bk.filter(b=>(b.mode||'SEA')===HMODE);
    $('#histOut').innerHTML=`
     <div class="card"><h3>견적 원장 <span class="pill">${hist.length}</span></h3>${hist.length?`<div style="overflow:auto"><table><thead><tr><th>적용일</th><th>화주</th><th>지역</th><th>POD</th><th>선사</th><th class="num">공표가</th><th class="num">실제가</th><th>결과</th><th>실주사유</th></tr></thead><tbody>
       ${hist.map(h=>`<tr><td class="mono" style="white-space:nowrap">${esc(h.apply_date||'')}</td><td><b>${esc(h.shipper||'')}</b></td><td>${esc(h.region||'')}</td><td>${esc(h.pod||'')}</td><td>${esc(h.carrier||'')}</td><td class="num">${h.published_price||'-'}</td><td class="num">${h.actual_price||'-'}</td><td><span class="tag st-${/수주/.test(h.result||'')?'수주':/실주/.test(h.result||'')?'실주':'접수'}">${esc(h.result||'')}</span></td><td style="color:var(--mut)">${esc(h.loss_reason||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="d">결과 없음</div>'}</div>
     <div class="card"><h3>부킹 이력 <span class="pill">${bk.length}</span></h3>${bk.length?`<div style="overflow:auto"><table><thead><tr><th>일자</th><th>BKG#</th><th>모드</th><th>화주</th><th>구분</th><th>POL</th><th>POD</th><th class="num">매출</th><th class="num">마진</th></tr></thead><tbody>
       ${bk.map(b=>`<tr><td class="mono" style="white-space:nowrap">${esc(b.bkg_date||'')}</td><td>${esc(b.bkg_no||'')}</td><td>${modeTag(b.mode)}</td><td><b>${esc(b.shipper||'')}</b></td><td style="color:var(--mut)">${esc(b.shipper_type||'')}</td><td>${esc(b.pol||'')}</td><td>${esc(b.pod||'')}</td><td class="num mono">${b.revenue?(+b.revenue).toLocaleString():'-'}</td><td class="num mono">${b.margin?(+b.margin).toLocaleString():'-'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="d">결과 없음</div>'}</div>`;
  }catch(e){ $('#histOut').innerHTML=`<div class="card"><div class="empty">${esc(e.message||e)}</div></div>`; }
};

/* ================= 연락처·선사 ================= */
const CON_MAJ=['선사','운송사','콘솔','협력사','실화주'];
const DESK_MAJ=['컨테이너','벌크','항공','콘솔','협력사'];
let CON=[],DESK=[];
let conF={major:'',sub:'',sort:'company_name',dir:1};
let deskF={major:'',trade:'',sort:'carrier',dir:1};
const uniqSort=(arr,f)=>[...new Set(arr.map(f).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ko'));
function selOpts(list,cur){ return ['<option value="">전체</option>',...list.map(o=>`<option${String(o)===String(cur)?' selected':''}>${esc(o)}</option>`)].join(''); }
function sortArrow(state,key){ return state.sort===key?(state.dir>0?' ▲':' ▼'):''; }
VIEWS.contacts=async function(){
  $('#main').innerHTML=`<h2>연락처 · 선사</h2><div class="sub">거래처 마스터 + 선사 데스크 · 대분류/중분류로 분류·정렬</div>
   <div class="card"><div class="row"><input id="cq" placeholder="회사·담당·이메일 검색(양쪽 공통)" style="flex:1;min-width:200px" oninput="conRender()"><button class="btn" onclick="conRender()">검색</button><button class="btn primary" onclick="newContactBlank()">➕ 거래처 추가</button></div></div>
   <div id="conCard"></div><div id="deskCard"></div>`;
  try{
    CON=await q('contacts',b=>b.limit(1000));
    DESK=await q('carrier_desk',b=>b.limit(1000));
    conRender();
  }catch(e){ $('#conCard').innerHTML=`<div class="card"><div class="empty">${esc(e.message||e)}</div></div>`; }
};
window.setConF=function(k,v){ conF[k]=v; if(k==='major')conF.sub=''; conRender(); };
window.openPartners=function(){ conF.major='협력사'; conF.sub='XLP'; go('contacts'); };
window.setDeskF=function(k,v){ deskF[k]=v; conRender(); };
window.conSort=function(key){ if(conF.sort===key)conF.dir*=-1; else{conF.sort=key;conF.dir=1;} conRender(); };
window.deskSort=function(key){ if(deskF.sort===key)deskF.dir*=-1; else{deskF.sort=key;deskF.dir=1;} conRender(); };
window.conRender=function(){
  const kw=($('#cq')?.value||'').trim().toLowerCase();
  const cmp=(a,b,s)=>String(a[s.sort]||'').localeCompare(String(b[s.sort]||''),'ko')*s.dir;
  // ── 거래처 ──
  let con=CON.filter(c=>{
    if(conF.major && c.major_category!==conF.major) return false;
    if(conF.sub && c.sub_category!==conF.sub) return false;
    if(kw && !((c.company_name||'')+(c.contact_name||'')+(c.email||'')).toLowerCase().includes(kw)) return false;
    return true; });
  con.sort((a,b)=>cmp(a,b,conF));
  const subList=uniqSort(CON.filter(c=>!conF.major||c.major_category===conF.major),c=>c.sub_category);
  const cH=(key,lbl)=>`<th style="cursor:pointer" onclick="conSort('${key}')">${lbl}${sortArrow(conF,key)}</th>`;
  $('#conCard').innerHTML=`<div class="card"><h3>거래처 <span class="pill">${con.length}/${CON.length}</span></h3>
    <div class="row" style="margin-bottom:10px">
      <select onchange="setConF('major',this.value)">${selOpts(CON_MAJ,conF.major)}</select>
      <select onchange="setConF('sub',this.value)">${selOpts(subList,conF.sub)}</select>
      ${(conF.major||conF.sub||kw)?`<button class="btn sm" onclick="conF={major:'',sub:'',sort:conF.sort,dir:conF.dir};document.getElementById('cq').value='';conRender()">필터해제</button>`:''}
    </div>
    ${con.length?`<div style="overflow:auto;max-height:440px"><table><thead><tr>${cH('major_category','대분류')}${cH('sub_category','중분류')}${cH('company_name','회사')}${cH('contact_name','담당')}<th>이메일</th>${cH('country_region','지역')}${cH('grade','등급')}<th></th></tr></thead><tbody>
      ${con.map(c=>`<tr><td><span class="pill">${esc(c.major_category||'')}</span></td><td style="color:var(--mut)">${esc(c.sub_category||'')}</td><td><b>${esc(c.company_name||'')}</b></td><td>${esc(c.contact_name||'')}</td><td style="color:var(--mut)">${esc(c.email||'')}</td><td>${esc(c.country_region||'')}</td><td>${esc(c.grade||'')}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="editContact('${c.id}')">수정</button></td></tr>`).join('')}
      </tbody></table></div>`:'<div class="d">조건에 맞는 거래처가 없습니다.</div>'}</div>`;
  // ── 선사 데스크 ──
  let desk=DESK.filter(d=>{
    if(deskF.major && d.major_category!==deskF.major) return false;
    if(deskF.trade && d.region!==deskF.trade) return false;
    if(kw && !((d.carrier||'')+(d.contact_name||'')+(d.email||'')).toLowerCase().includes(kw)) return false;
    return true; });
  desk.sort((a,b)=>cmp(a,b,deskF));
  const tradeList=uniqSort(DESK.filter(d=>!deskF.major||d.major_category===deskF.major),d=>d.region);
  const dH=(key,lbl)=>`<th style="cursor:pointer" onclick="deskSort('${key}')">${lbl}${sortArrow(deskF,key)}</th>`;
  $('#deskCard').innerHTML=`<div class="card"><h3>선사 데스크 <span class="pill">${desk.length}/${DESK.length}</span></h3>
    <div class="row" style="margin-bottom:10px">
      <select onchange="setDeskF('major',this.value)">${selOpts(DESK_MAJ,deskF.major)}</select>
      <select onchange="setDeskF('trade',this.value)">${selOpts(tradeList,deskF.trade)}</select>
      ${(deskF.major||deskF.trade)?`<button class="btn sm" onclick="deskF={major:'',trade:'',sort:deskF.sort,dir:deskF.dir};conRender()">필터해제</button>`:''}
      <button class="btn primary sm" style="margin-left:auto" onclick="newDeskBlank()">➕ 선사 데스크 추가</button>
    </div>
    ${desk.length?`<div style="overflow:auto;max-height:440px"><table><thead><tr>${dH('major_category','대분류')}${dH('region','트레이드')}${dH('carrier','선사')}${dH('role','구분')}${dH('contact_name','담당')}<th>직위</th><th>이메일</th><th>비고</th><th></th></tr></thead><tbody>
      ${desk.map(d=>`<tr><td><span class="pill">${esc(d.major_category||'')}</span></td><td>${esc(d.region||'')}</td><td><b>${esc(d.carrier||'')}</b></td><td style="color:var(--mut)">${esc(d.role||'')}</td><td>${esc(d.contact_name||'')}</td><td style="color:var(--mut)">${esc(d.title||'')}</td><td style="color:var(--mut)">${esc(d.email||'')}</td><td style="color:var(--mut)">${esc(d.note||'')}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="editDesk('${d.id}')">수정</button></td></tr>`).join('')}
      </tbody></table></div>`:'<div class="d">조건에 맞는 데스크가 없습니다.</div>'}</div>`;
};

     <div class="fld"><label>담당자</label><input id="nc_contact" value="${esc(pre.contact||'')}"></div>
     <div class="fld"><label>이메일</label><input id="nc_email" value="${esc(pre.email||'')}"></div>
     <div class="fld"><label>전화</label><input id="nc_phone" value="${esc(pre.phone||'')}"></div>
     <div class="fld"><label>휴대폰</label><input id="nc_mobile" value="${esc(pre.mobile||'')}"></div>
     <div class="fld"><label>지역</label><input id="nc_region" value="${esc(pre.region||'')}"></div>
     <div class="fld"><label>등급</label><input id="nc_grade" value="${esc(pre.grade||'')}" placeholder="A/B/C"></div>
     <div class="fld full"><label>메모</label><input id="nc_notes" value="${esc(pre.notes||'')}"></div>

   <div class="row" style="margin-top:14px"><button class="btn win" onclick="saveNewContact()">${editing?'수정 저장':'거래처 저장'}</button>${editing?`<button class="btn" onclick="delContact('${pre.id}')" style="color:var(--loss)">삭제</button>`:''}</div>`;
}
window.ncSeg=function(btn,val){ const g=btn.parentNode; [...g.querySelectorAll('.segb')].forEach(b=>b.classList.toggle('on',b===btn)); g.dataset.val=val; };
window.openContactModal=function(){ showModal(contactModalHTML(NCPRE)); };
window.newContactBlank=function(){ NCPRE={major:'실화주',_from:'contacts'}; openContactModal(); };
window.newContactIntake=function(){ NCPRE={company:JOBW.shipper||'',email:JOBW._email||'',phone:JOBW._phone||'',contact:JOBW._contact||'',major:'실화주',sub:'실화주',_from:'intake'}; openContactModal(); };
window.acAddContact=function(ev,encq){ ev.preventDefault(); const name=decodeURIComponent(encq); NCPRE={company:name,email:JOBW._email||'',phone:JOBW._phone||'',contact:JOBW._contact||'',major:'실화주',sub:'실화주',_from:'intake'}; openContactModal(); };
window.editContact=function(id){ const c=(CON||[]).find(x=>x.id===id); if(!c){toast('대상 없음',true);return;}
  NCPRE={id:c.id,major:c.major_category,sub:c.sub_category,company:c.company_name,contact:c.contact_name,email:c.email,phone:c.phone,mobile:c.mobile,region:c.country_region,grade:c.grade,notes:c.notes,_from:'contacts'}; openContactModal(); };
window.saveNewContact=async function(){
  const g=id=>($('#'+id)?.value||'').trim();
  const major=document.getElementById('nc_major')?.dataset.val||'실화주';
  const company=g('nc_company'); if(!company){ toast('회사명을 입력하세요',true); return; }
  const row={major_category:major,sub_category:g('nc_sub')||null,company_name:company,contact_name:g('nc_contact')||null,email:g('nc_email')||null,phone:g('nc_phone')||null,mobile:g('nc_mobile')||null,country_region:g('nc_region')||null,grade:g('nc_grade')||null,notes:g('nc_notes')||null};
  const from=NCPRE._from, id=NCPRE.id;
  try{ let error;
    if(id){ ({error}=await SB.from('contacts').update(row).eq('id',id)); }
    else{ ({error}=await SB.from('contacts').insert(row)); }
    if(error)throw error;
    toast((id?'거래처 수정 완료 · ':'거래처 등록 완료 · ')+company); closeModal();
    if(!id && !SHIPPERS.includes(company)) SHIPPERS.unshift(company);
    if(from==='intake'){ JOBW.shipper=company; if($('#jobForm'))renderJobForm(); }
    if(CURRENT==='contacts'){ try{ CON=await q('contacts',b=>b.limit(1000)); }catch(e){} if(typeof conRender==='function')conRender(); }
  }catch(e){ toast(e.message||e,true); }
};
window.delContact=async function(id){
  try{ const {error}=await SB.from('contacts').delete().eq('id',id); if(error)throw error;
    CON=(CON||[]).filter(x=>x.id!==id); toast('거래처 삭제됨'); closeModal();
    if(CURRENT==='contacts'&&typeof conRender==='function')conRender();
  }catch(e){ toast(e.message||e,true); }
};
let NDPRE={};
function deskModalHTML(pre){ pre=pre||{}; const maj=pre.major_category||'컨테이너'; const editing=!!pre.id;
  return `<h3>${editing?'✏ 선사 데스크 수정':'➕ 선사 데스크 추가'}</h3>
   <div class="formgrid" style="margin-top:12px">
     <div class="fld full"><label>대분류</label><div class="seg" id="nd_major" data-val="${esc(maj)}">${DESK_MAJ.map(m=>`<button type="button" class="segb${maj===m?' on':''}" onclick="ncSeg(this,'${m}')">${m}</button>`).join('')}</div></div>
     <div class="fld"><label>트레이드/지역</label><input id="nd_region" value="${esc(pre.region||'')}" placeholder="USWC·EUROPE(NCP) 등"></div>
     <div class="fld"><label>선사명 *</label><input id="nd_carrier" value="${esc(pre.carrier||'')}"></div>
     <div class="fld"><label>구분</label><input id="nd_role" value="${esc(pre.role||'')}" placeholder="총괄·항로 담당"></div>
     <div class="fld"><label>담당자</label><input id="nd_contact" value="${esc(pre.contact_name||'')}"></div>
     <div class="fld"><label>직위</label><input id="nd_title" value="${esc(pre.title||'')}"></div>
     <div class="fld"><label>이메일</label><input id="nd_email" value="${esc(pre.email||'')}"></div>
     <div class="fld"><label>전화</label><input id="nd_phone" value="${esc(pre.phone||'')}"></div>
     <div class="fld"><label>휴대폰</label><input id="nd_mobile" value="${esc(pre.mobile||'')}"></div>
     <div class="fld full"><label>비고</label><input id="nd_note" value="${esc(pre.note||'')}"></div>
   </div>
   <div class="row" style="margin-top:14px"><button class="btn win" onclick="saveDesk()">${editing?'수정 저장':'저장'}</button>${editing?`<button class="btn" onclick="delDesk('${pre.id}')" style="color:var(--loss)">삭제</button>`:''}</div>`;
}
window.newDeskBlank=function(){ NDPRE={major_category:'컨테이너'}; showModal(deskModalHTML(NDPRE)); };
window.editDesk=function(id){ const d=(DESK||[]).find(x=>x.id===id); if(!d){toast('대상 없음',true);return;} NDPRE={...d}; showModal(deskModalHTML(NDPRE)); };
window.saveDesk=async function(){
  const g=id=>($('#'+id)?.value||'').trim();
  const carrier=g('nd_carrier'); if(!carrier){toast('선사명을 입력하세요',true);return;}
  const row={major_category:document.getElementById('nd_major')?.dataset.val||'컨테이너',region:g('nd_region')||null,carrier,role:g('nd_role')||null,contact_name:g('nd_contact')||null,title:g('nd_title')||null,email:g('nd_email')||null,phone:g('nd_phone')||null,mobile:g('nd_mobile')||null,note:g('nd_note')||null};
  try{ let error;
    if(NDPRE.id){ ({error}=await SB.from('carrier_desk').update(row).eq('id',NDPRE.id)); }
    else{ ({error}=await SB.from('carrier_desk').insert(row)); }
    if(error)throw error; toast((NDPRE.id?'수정':'등록')+' 완료 · '+carrier); closeModal();
    if(CURRENT==='contacts'){ try{ DESK=await q('carrier_desk',b=>b.limit(1000)); }catch(e){} conRender(); }
  }catch(e){ toast(e.message||e,true); }
};
window.delDesk=async function(id){
  try{ const {error}=await SB.from('carrier_desk').delete().eq('id',id); if(error)throw error;
    DESK=(DESK||[]).filter(x=>x.id!==id); toast('선사 데스크 삭제됨'); closeModal(); if(CURRENT==='contacts')conRender();
  }catch(e){ toast(e.message||e,true); }
};

/* ================= 포트코드 관리 ================= */
VIEWS.ports=async function(){
  try{ PORTDB=await q('ports',b=>b.order('code')); }catch(e){ PORTDB=[]; }
  const regions=[...new Set(PORTDB.map(p=>p.region).filter(Boolean))];
  $('#main').innerHTML=`<h2>포트코드 관리</h2><div class="sub">UN/LOCODE · 국가2자+항구3자 (예: KRPUS 부산, DEHAM 함부르크) · 인테이크 POL/POD 자동완성에 연동</div>
   <div class="card"><h3>➕ 포트코드 추가</h3>
     <div class="row">
       <input id="pcCode" placeholder="코드 5자 (DEHAM)" maxlength="5" style="width:140px;text-transform:uppercase">
       <input id="pcName" placeholder="항구명 (함부르크 Hamburg)" style="flex:1;min-width:200px">
       <input id="pcCountry" placeholder="국가2자 (DE)" maxlength="2" style="width:110px;text-transform:uppercase">
       <select id="pcRegion"><option value="">지역(선택)</option>${regions.map(r=>`<option>${esc(r)}</option>`).join('')}</select>

function csvCell(v){ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCSV(filename,headers,rows){
  const lines=[headers.map(csvCell).join(',')].concat(rows.map(r=>r.map(csvCell).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function isoWeek(dstr){ const d=new Date(dstr); if(isNaN(d))return ''; const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return 'WK'+String(Math.ceil((((t-ys)/86400000)+1)/7)).padStart(2,'0'); }
function periodKey(dstr,unit){ const d=String(dstr||''); if(d.length<7)return '(미상)'; const y=d.slice(0,4),m=+d.slice(5,7);
  if(unit==='분기')return `${y} Q${Math.ceil(m/3)}`; if(unit==='반기')return `${y} ${m<=6?'상반기':'하반기'}`; if(unit==='연')return y; return d.slice(0,7); }

function verdictHTML(recv,min){ if(recv==null||min==null) return ''; const d=(recv-min)/min;
  return d<=0 ? `<span style="color:var(--win);font-weight:700">표 최저가 이하 ✓ (${(d*100).toFixed(1)}%)</span>`
              : `<span style="color:var(--loss);font-weight:700">표 최저 대비 +${(d*100).toFixed(1)}% 높음</span>`; }
async function rateLookup(pol,pod,ct,recv){
  pol=portTerm(pol); pod=portTerm(pod);
  if(!pod){ return '<div class="d">POD를 입력하세요.</div>'; }
  let rows=[];
  try{ let b=SB.from('rate_cards').select('*').ilike('pod',`%${pod}%`);
    if(pol) b=b.ilike('pol',`%${pol}%`); if(ct) b=b.eq('container_type',ct);
    const {data,error}=await b.order('freight_usd').limit(200); if(error)throw error; rows=data||[];
  }catch(e){ return `<div class="empty">${esc(e.message||e)}</div>`; }
  if(!rows.length) return `<div class="empty">해당 레인(${esc(pod)}${ct?' / '+ct:''})의 요율표 데이터가 없습니다.<br><span style="font-size:11px">요율표는 '가져오기'에서 rate_cards.csv를 적재하면 채워집니다.</span></div>`;
  const min=Math.min(...rows.map(r=>+r.freight_usd));
  const body=rows.map(r=>{const fr=+r.freight_usd; const dr=recv!=null?((recv-fr)/fr):null;
    return `<tr><td>${esc(r.carrier)}${r.rate_type?` <span style="color:var(--mut2);font-size:11px">${esc(r.rate_type)}</span>`:''}</td><td>${esc(r.pol)}→${esc(r.pod)}</td><td>${esc(r.container_type)}</td><td class="num"${fr===min?' style="color:var(--win);font-weight:700"':''}>${fr.toLocaleString()}</td><td style="color:var(--mut)">${esc(r.valid_to||'')}</td>${recv!=null?`<td class="num" style="color:${dr<=0?'var(--win)':'var(--loss)'}">${dr>0?'+':''}${(dr*100).toFixed(1)}%</td>`:''}</tr>`;}).join('');
  return `<div class="d">표 최저가 <b style="color:var(--win)">USD ${min.toLocaleString()}</b>${recv!=null?` · 받은견적 <b>USD ${recv.toLocaleString()}</b> → ${verdictHTML(recv,min)}`:''} · ${rows.length}건</div>
    <div style="overflow:auto;max-height:320px"><table><thead><tr><th>선사</th><th>레인</th><th>CNTR</th><th class="num">USD</th><th>유효</th>${recv!=null?'<th class="num">견적Δ</th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;
}

       :'<div class="d">요율표 미적재. \'가져오기\'에서 rate_cards.csv를 올리거나, 잠시 후 적재됩니다.</div>'}</div>`;

/* ================= 가져오기 (CSV → Supabase) ================= */
const COERCE={
  contacts:{automation_linked:'bool'},
  carrier_desk:{},
  quote_history:{apply_date:'date',published_price:'num',actual_price:'num',discount_rate:'num',competitor_est:'num'},
  bookings:{wk:'int',cntr_20dv:'int',cntr_40hq:'int',cntr_20fr:'int',cntr_40fr:'int',revenue:'num',purchase:'num',margin:'num',bkg_date:'date'},
  regions:{}, rate_cards:{freight_usd:'num',valid_to:'date'}
};
function parseCSV(text){ text=text.replace(/^﻿/,''); const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}}
  if(f.length||row.length){row.push(f);rows.push(row);} return rows; }
function coerce(table,obj){ const map=COERCE[table]||{}; const o={};
  for(const k in obj){ let v=obj[k]; if(v===''){o[k]=null;continue;}
    const t=map[k];
    if(t==='num'||t==='int'){const n=parseFloat(String(v).replace(/[,%$\s]/g,''));o[k]=isNaN(n)?null:(t==='int'?Math.round(n):n);}
    else if(t==='bool')o[k]=/^(true|1|o|y|예)$/i.test(String(v).trim());
    else if(t==='date'){o[k]=String(v).slice(0,10)||null;}
    else o[k]=v; }
  return o; }
VIEWS.import=function(){
  $('#main').innerHTML=`<h2>가져오기</h2><div class="sub">기존 히스토리 CSV를 허브(Supabase)로 적재 — 대화에서 받은 파일을 각 항목에 올리세요</div>
   <div class="card"><h3>기존 데이터 적재</h3><div class="d">파일명은 자유. 표는 헤더가 컬럼명과 일치해야 합니다(전달드린 CSV는 이미 일치).</div>
     ${['contacts','carrier_desk','quote_history','bookings','regions','rate_cards'].map(t=>
       `<div class="row" style="margin:8px 0"><div style="width:130px"><b>${t}</b></div>
         <input type="file" accept=".csv" onchange="importCSV('${t}',this)"><span id="imp_${t}" class="d" style="margin:0"></span></div>`).join('')}
     <div class="d" style="margin-top:10px">※ 중복 방지를 위해 같은 파일을 두 번 올리지 마세요(regions는 code 기준 덮어쓰기).</div></div>`;
};
window.importCSV=async function(table,input){
  const f=input.files[0]; if(!f)return; const st=$('#imp_'+table); st.textContent='읽는 중…';
  const text=await f.text(); const rows=parseCSV(text).filter(r=>r.length&&r.some(c=>c!==''));
  if(rows.length<2){st.textContent='행 없음';return;}
  const head=rows[0].map(h=>h.trim()); const objs=rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return coerce(table,o);});
  try{ let done=0;
    for(let i=0;i<objs.length;i+=100){ const chunk=objs.slice(i,i+100);
      let res; if(table==='regions')res=await SB.from(table).upsert(chunk,{onConflict:'code'}); else res=await SB.from(table).insert(chunk);
      if(res.error)throw res.error; done+=chunk.length; st.textContent=`${done}/${objs.length} 적재…`; }
    st.textContent=`✅ ${objs.length}건 적재 완료`; toast(`${table}: ${objs.length}건 적재`);
  }catch(e){ st.textContent='❌ '+(e.message||e); toast(e.message||e,true); }
};

window.openCBM=function(){
  showModal(`<h3>📦 CBM · R.TON 계산기</h3><div class="d">치수(cm)·수량·중량 입력 → CBM과 운임톤(R.TON) 자동 계산</div>
    <div class="row" style="margin:10px 0">
      <input id="cbmL" placeholder="가로 L(cm)" style="width:100px"><input id="cbmW" placeholder="세로 W(cm)" style="width:100px">
      <input id="cbmH" placeholder="높이 H(cm)" style="width:100px"><input id="cbmQ" placeholder="수량" value="1" style="width:70px">
      <input id="cbmKg" placeholder="총중량(kg)" style="width:100px"><button class="btn primary" onclick="runCBM()">계산</button></div>
    <div id="cbmOut" class="d">값을 넣고 계산을 누르세요.</div>`);
};
window.runCBM=function(){
  const L=num($('#cbmL').value),W=num($('#cbmW').value),H=num($('#cbmH').value),Q=num($('#cbmQ').value)||1,KG=num($('#cbmKg').value);
  if(L==null||W==null||H==null){ $('#cbmOut').textContent='가로·세로·높이를 입력하세요.'; return; }
  const cbm=(L*W*H/1e6)*Q; const rton=KG!=null?Math.max(cbm,KG/1000):cbm;
  $('#cbmOut').innerHTML=`<div style="font-size:15px">CBM = <b style="color:var(--accent)">${cbm.toFixed(3)} m³</b>`
    +(KG!=null?` · 중량톤 ${(KG/1000).toFixed(3)} → <b style="color:var(--win)">R.TON ${rton.toFixed(3)}</b>`:'')+`</div>
    <div class="d" style="margin-top:6px">R.TON = max(CBM, 중량톤) · 1 CBM = ${(cbm/Q).toFixed(3)}m³/개 × ${Q}개</div>`;
};
